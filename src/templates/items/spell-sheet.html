<div class="dw-item-sheet">
  {{> "systems/dungeonworld/templates/items/parts/item-header.html"}}

  <nav class="dw-tabs tabs">
    <button type="button" class="dw-tab {{tabs.description.cssClass}}" data-action="tab" data-group="primary" data-tab="description">{{localize "DW.Common.Description"}}</button>
    <button type="button" class="dw-tab {{tabs.details.cssClass}}" data-action="tab" data-group="primary" data-tab="details">{{localize "DW.Common.Details"}}</button>
  </nav>

  <section class="tab dw-panel {{tabs.description.cssClass}}" data-group="primary" data-tab="description">
    <div class="dw-field dw-field--grow">
      <span class="dw-label">{{localize "DW.Description"}}</span>
      <prose-mirror name="system.description" value="{{system.description}}" toggled>{{{system.descriptionEnriched}}}</prose-mirror>
    </div>
  </section>

  <section class="tab dw-panel {{tabs.details.cssClass}}" data-group="primary" data-tab="details">
    <div class="dw-fields">
      <span class="dw-label">{{localize "DW.Class"}}</span>
      <select name="system.class">
        {{selectOptions selects.classes selected=system.class blank='—' localize=true}}
      </select>

      <span class="dw-label">{{localize "DW.SpellLevel"}}</span>
      <input type="number" name="system.spellLevel" value="{{system.spellLevel}}" min="0" step="1"/>

      <span class="dw-label">{{localize "DW.SpellPrepared"}}</span>
      <input type="checkbox" name="system.prepared" {{checked system.prepared}}/>

      <span class="dw-label">{{localize "DW.SpellRollFormula"}}</span>
      <input type="text" name="system.rollFormula" value="{{system.rollFormula}}" placeholder="e.g. 1d4+3"/>
    </div>
  </section>
</div>
