<section class="tab dw-panel {{tab.cssClass}}" data-group="primary" data-tab="equipment">
  <div class="dw-summary">
    <div class="dw-summary-item dw-load--{{load.tier}} {{#if load.warn}}dw-summary-item--warn{{/if}}">
      <span class="dw-label">{{localize "DW.Weight"}}</span>
      <span class="dw-readonly">{{weight}}</span>
      <span class="dw-of">/</span>
      <input type="number" name="system.attributes.weight.max" value="{{weightMax}}" step="1" aria-label="Max {{localize "DW.Weight"}}"/>
      <span class="dw-hint" {{#if load.tooltip}}data-tooltip="{{load.tooltip}}"{{/if}}>{{load.text}}</span>
    </div>
    <div class="dw-summary-item">
      <span class="dw-label">{{localize "DW.Coin"}}</span>
      <span class="dw-stepper">
        <button type="button" class="dw-step" data-action="adjustResource" data-attr="attributes.coin.value" data-delta="-1" aria-label="{{localize "DW.Sheet.Decrease"}} {{localize "DW.Coin"}}"><i class="fas fa-minus" inert></i></button>
        <input type="number" name="system.attributes.coin.value" value="{{system.attributes.coin.value}}" step="1" aria-label="{{localize "DW.Coin"}}"/>
        <button type="button" class="dw-step" data-action="adjustResource" data-attr="attributes.coin.value" data-delta="1" aria-label="{{localize "DW.Sheet.Increase"}} {{localize "DW.Coin"}}"><i class="fas fa-plus" inert></i></button>
      </span>
    </div>
  </div>

  <section class="dw-section">
    <header class="dw-section-head">
      <span class="dw-section-title">{{localize "DW.Equipment"}}</span>
      <span class="dw-count">{{equipment.length}}</span>
      {{#if editable}}
      <button type="button" class="dw-add" data-action="createItem" data-type="equipment" aria-label="{{localize "DW.Add"}} {{localize "DW.Equipment"}}">
        <i class="fas fa-plus" inert></i>
      </button>
      {{/if}}
    </header>
    <ol class="dw-rows">
      {{#each equipment}}
      {{> "systems/dungeonworld/templates/sheet/character/item-row.html" editable=../editable}}
      {{/each}}
    </ol>
  </section>
</section>
