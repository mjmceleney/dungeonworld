<section class="tab dw-panel {{tab.cssClass}}" data-group="primary" data-tab="spells">
  {{#each spellLevels}}
  <section class="dw-section">
    <header class="dw-section-head">
      <span class="dw-section-title">{{label}}</span>
      <span class="dw-count">{{spells.length}}</span>
      {{#if ../editable}}
      <button type="button" class="dw-add" data-action="createItem" data-type="spell" data-level="{{level}}" aria-label="{{localize "DW.Add"}} {{label}}">
        <i class="fas fa-plus" inert></i>
      </button>
      {{/if}}
    </header>
    <ol class="dw-rows">
      {{#each spells}}
      {{> "systems/dungeonworld/templates/sheet/character/item-row.html" editable=../../editable}}
      {{/each}}
    </ol>
  </section>
  {{/each}}
</section>
