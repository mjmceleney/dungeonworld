<section class="dw-card dw-npc-stats">
  <div class="dw-header-stat dw-npc-stat dw-npc-stat--hp">
    <span class="dw-label">{{localize "DW.Sheet.HitPoints"}}</span>
    <div class="dw-hp-value">
      <button type="button" class="dw-step" data-action="adjustResource" data-attr="attributes.hp.value" data-delta="-1" aria-label="{{localize "DW.Sheet.Decrease"}} {{localize "DW.HP"}}"><i class="fas fa-minus" inert></i></button>
      <input class="dw-big" type="number" name="system.attributes.hp.value" value="{{hp}}" step="1" aria-label="{{localize "DW.HP"}}"/>
      <span class="dw-of">/</span>
      <input class="dw-small" type="number" name="system.attributes.hp.max" value="{{hpMax}}" step="1" aria-label="Max {{localize "DW.HP"}}"/>
      <button type="button" class="dw-step" data-action="adjustResource" data-attr="attributes.hp.value" data-delta="1" aria-label="{{localize "DW.Sheet.Increase"}} {{localize "DW.HP"}}"><i class="fas fa-plus" inert></i></button>
    </div>
    <div class="dw-bar"><div class="dw-bar-fill dw-bar-fill--hp-{{hpState}}" style="width: {{hpPct}}%"></div></div>
  </div>

  <div class="dw-divider"></div>

  <div class="dw-header-stat dw-npc-stat dw-npc-stat--armor">
    <span class="dw-label">{{localize "DW.Armor"}}</span>
    <input class="dw-big" type="number" name="system.attributes.ac.value" value="{{system.attributes.ac.value}}" step="1" aria-label="{{localize "DW.Armor"}}"/>
  </div>

  <div class="dw-divider"></div>

  <div class="dw-header-stat dw-npc-stat dw-npc-stat--damage">
    <span class="dw-label">{{localize "DW.Damage"}}</span>
    <button type="button" class="dw-roll-chip" data-action="rollDamage" aria-label="{{localize "DW.Damage"}} {{system.attributes.damage.value}}">
      <i class="fas fa-dice-d20" inert></i>
      <span>{{#if system.attributes.damage.value}}{{system.attributes.damage.value}}{{else}}—{{/if}}</span>
    </button>
    <div class="dw-damage-inputs">
      <input type="text" name="system.attributes.damage.value" value="{{system.attributes.damage.value}}" placeholder="e.g. 2d12+7" aria-label="{{localize "DW.Damage"}}"/>
      <input type="text" name="system.attributes.damage.piercing" value="{{system.attributes.damage.piercing}}" placeholder="e.g. 4 piercing" aria-label="Piercing"/>
    </div>
  </div>
</section>
