Item:
  types:
    - move
    - npcMove
    - equipment
    - spell
    - bond
    - tag
    - class
  templates:
    base:
      name: ''
      description: ''
    move:
      choices: ''
      moveType: null
      rollFormula: ''
      moveResults:
        failure:
          value: ''
        partial:
          value: ''
        success:
          value: ''
  move:
    templates:
      - base
      - move
    class: null
    rollType: ''
    rollMod: 0
    requiresLevel: 0
    requiresMove: ''
    moveType:
    moveGroup: ''
    # A resource the move can spend, such as Volley's ammo: gear whose name
    # or tags match, how much, and when the chat card offers it (always, on a
    # hit, on a 7-9 or on a 10+).
    resource:
      name: ''
      amount: 1
      when: ''
    # Moves like Armored: ignore the clumsy tag on armor you wear ("armor"),
    # or on all your gear ("all").
    ignoreClumsy: ''
    # Moves such as Multiclass Dabbler grant a move (or spell) from another
    # class, chosen after the level up. classes: comma-separated names, blank
    # for any other class. levelOffset: -1 for "treat your level as one lower".
    # Moves such as Divine Favor instead give named moves of the first listed
    # class (moves) and let the character cast its spells (casting): as that
    # class at level 1 when taken, one level higher each level after.
    grants:
      kind: ''
      classes: ''
      levelOffset: 0
      moves: ''
      casting: false
  npcMove:
    templates:
      - base
      - move
  equipment:
    templates:
      - base
    class: null
    quantity: 1
    equipped: false
    weight: 0
    price: 0
    uses: 0
    tags: '[]'
    tagsString: ''
    magic: false
    itemType: null
    attributes: {}
    # What using the item does (its Use button spends one): heal this much,
    # to yourself or someone else, optionally "or remove a debility instead".
    useHeal: 0
    useTarget: self
    useCure: false
  spell:
    templates:
      - base
    spellLevel: 0
    rollFormula: ''
    prepared: false
    class: null
  bond:
    templates:
      - base
  tag:
    templates:
      - base
  class:
    templates:
      - base
    races: {}
    alignments: {}
    equipment: {}
    hp: 10
    load: 6
    damage: d6
    # Secret classes aren't offered for multiclassing or as "another class".
    secret: false
    # Look options for character creation: one group per line, options
    # separated by commas or "or" (e.g. "Hard Eyes, Dead Eyes, or Eager Eyes").
    looks: ''
