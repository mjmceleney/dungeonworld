DW.Hireling.OrderHint: "Roll+loyalty when your orders put them somewhere dangerous, degrading, or just flat-out crazy."
DW.Hireling.OrderText: "Hirelings do what you tell them to, so long as it isn't obviously dangerous, degrading, or stupid, and their cost is met. When a hireling finds themselves in a dangerous, degrading, or just flat-out crazy situation due to your orders, roll+loyalty."
DW.Hireling.OrderSuccess: "They stand firm and carry out the order."
DW.Hireling.OrderPartial: "They do it for now, but come back with serious demands later. Meet them or the hireling quits on the worst terms."
