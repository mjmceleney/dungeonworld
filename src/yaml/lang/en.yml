DW.Hireling.Skill.adept: "Adept"
DW.Hireling.Skill.adeptBlurb: "Apprenticed to an arcane expert, but not powerful in their own right."
DW.Hireling.Skill.adeptMove1: "Arcane Assistance"
DW.Hireling.Skill.adeptMove1Text: "When an adept aids in the casting of a spell of lower level than their skill ({skill}), the spell's effects have greater range, duration, or potency, as the GM describes before the spell is cast. Any negative effects of the casting are focused on the adept first."
DW.Hireling.Skill.burglar: "Burglar"
DW.Hireling.Skill.burglarBlurb: "Good with devices and traps, but not too helpful in the field of battle."
DW.Hireling.Skill.burglarMove1: "Experimental Trap Disarming"
DW.Hireling.Skill.burglarMove1Text: "If a trap would be sprung while a burglar is leading the way, the burglar suffers the full effects but the players get +{skill} against the trap and add {skill} to their armor against it. Most traps leave a burglar in need of immediate healing. If the players Make Camp near the trap, the burglar can disarm it by the time camp is broken."
DW.Hireling.Skill.minstrel: "Minstrel"
DW.Hireling.Skill.minstrelBlurb: "A smiling face to smooth things over or negotiate a deal."
DW.Hireling.Skill.minstrelMove1: "A Hero's Welcome"
DW.Hireling.Skill.minstrelMove1Text: "When you enter a place of food, drink, or entertainment with a minstrel you will be treated as a friend by everyone present (unless your actions prove otherwise). You also subtract {skill} from all prices in town."
DW.Hireling.Skill.priest: "Priest"
DW.Hireling.Skill.priestBlurb: "Lower ranking clergy who can call upon their deity for minor aid."
DW.Hireling.Skill.priestMove1: "Ministry"
DW.Hireling.Skill.priestMove1Text: "When you make camp with a priest, if you would normally heal you heal +{skill} HP."
DW.Hireling.Skill.priestMove2: "First Aid"
DW.Hireling.Skill.priestMove2Text: "When a priest staunches your wounds heal {double} HP. You take -1 forward as their healing is painful and distracting."
DW.Hireling.Skill.protector: "Protector"
DW.Hireling.Skill.protectorBlurb: "Stands between their employer and the blades, fangs, and spells that would harm them."
DW.Hireling.Skill.protectorMove1: "Sentry"
DW.Hireling.Skill.protectorMove1Text: "When a protector stands between you and an attack you increase your armor against that attack by {skill}, then reduce their skill by 1 until they receive healing or have time to mend."
DW.Hireling.Skill.protectorMove2: "Intervene"
DW.Hireling.Skill.protectorMove2Text: "When a protector helps you defy danger you may opt to take +1 from their aid. If you do you cannot get a 10+ result; a 10+ instead counts as a 7–9."
DW.Hireling.Skill.tracker: "Tracker"
DW.Hireling.Skill.trackerBlurb: "Knows the secrets of following a trail."
DW.Hireling.Skill.trackerMove1: "Track"
DW.Hireling.Skill.trackerMove1Text: "When a tracker is given time to study a trail while Making Camp, when camp is broken they can follow the trail to the next major change in terrain, travel, or weather."
DW.Hireling.Skill.trackerMove2: "Guide"
DW.Hireling.Skill.trackerMove2Text: "When a tracker leads the way you automatically succeed on any Perilous Journey of a distance (in rations) lower than {skill}."
DW.Hireling.Skill.warrior: "Warrior"
DW.Hireling.Skill.warriorBlurb: "Not a master of combat, but handy with a weapon."
DW.Hireling.Skill.warriorMove1: "Man-at-arms"
DW.Hireling.Skill.warriorMove1Text: "When you deal damage while a warrior aids you, add {skill} to the damage done. If your attack results in consequences (like a counter attack) the man-at-arms takes the brunt of it."

